<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Projects | ImmXrsive</title>
</head>
<body>
    <main>
    <a href="./profile.html">Back to My Profile</a>
    <h1>My Projects</h1>
    <h2>Add Project</h2>

    <form id="project-form">
        <p>
        <label for="title">Project title</label><br>
        <input id="title" name="title" required maxlength="150">
        </p>
        <p>
        <label for="short-description">Short description</label><br>
        <textarea id="short-description" name="short_description"
            maxlength="500" rows="4"></textarea>
    
        <p>
        <label for="domain">Domain / Type</label><br>
        <input id="domain" name="domain" maxlength="100" placeholder="e.g., Web application">
    </p>
    <p>
        <label for="technologies">Technologies (comma-separated)</label><br>
        <input id="technologies" name="technologies" maxlength="300"
        placeholder="e.g., JavaScript, Express, PostgreSQL">
    </p>
        <p>
    <label for="project-date">Project Date</label><br>
    <input type="date" id="project-date" name="project_date">
    </p>
    <p>
    <label for="project-status">Project Status</label><br>
    <select id="project-status" name="project_status">
        <option value="">Select a status</option>
        <option value="planned">Planned</option>
        <option value="in_progress">In progress</option>
        <option value="completed">Completed</option>
    </select>
    </p>
    <p>
        <label for="source-url">Source URL</label><br>
        <input type="url" id="source-url" name="source_url" maxlength="2048">
    </p>
    <p>
        <label for="demo-url">Playable Demo URL</label><br>
        <input type="url" id="demo-url" name="demo_url" maxlength="2048">
    </p>
    <p>
        <label for="fallback-url">Fallback Evidence URL</label><br>
        <input type="url" id="fallback-url" name="fallback_url" maxlength="2048">
    </p>
        <button type="submit">Save Draft</button>
        <button id="cancel-edit" type="button" hidden>Cancel Edit</button>
    </form>

    <p id="project-feedback" role="status"></p>

    <h2>Saved Projects</h2>
<p id="projects-status" role="status"></p>
<ul id="saved-projects"></ul>
</main>

<script src="./config.js"></script>
<script src="./my-projects.js"></script>
</body>
</html>
