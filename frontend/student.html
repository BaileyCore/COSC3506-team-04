<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Student Profile</title>

<style>
    * {
    box-sizing: border-box;
    }

    body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    color: #1f2937;
    }

    header {
    background: #111827;
    color: white;
    padding: 1.5rem;
    }

    main {
    max-width: 900px;
    margin: 0 auto;
    padding: 1.5rem;
    }

    .profile,
    .project-card {
    background: white;
    padding: 1.25rem;
    border-radius: 10px;
    margin-bottom: 1rem;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .avatar { width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; font-size: 1.5rem; font-weight: 700; background: #dbeafe; color: #1e3a8a; margin-bottom: .75rem; }
    body[data-theme="warm"] .avatar { background: #fed7aa; color: #7c2d12; }
    .skills {
    display: flex;
    flex-wrap: wrap;
    gap: .4rem;
    margin: .75rem 0;
    }

    .skill {
    background: #e5e7eb;
    padding: .25rem .6rem;
    border-radius: 999px;
    font-size: .85rem;
    }

    a,
    button {
    display: inline-block;
    margin-top: .5rem;
    }

    button {
    cursor: pointer;
    padding: .7rem 1rem;
    border: none;
    border-radius: 6px;
    background: #2563eb;
    color: white;
    }

    button:focus,
    a:focus {
    outline: 3px solid #93c5fd;
    outline-offset: 2px;
    }

    body[data-theme="compact"] main { max-width: 760px; }
    body[data-theme="compact"] .profile, body[data-theme="compact"] .project-card { padding: .75rem; border-radius: 4px; box-shadow: none; }
    body[data-theme="warm"] { background: #fff7ed; color: #431407; }
    body[data-theme="warm"] header { background: #7c2d12; }
    body[data-theme="warm"] .profile, body[data-theme="warm"] .project-card { border: 1px solid #fed7aa; background: #fffbeb; }
    @media (max-width: 390px) {
    main {
        padding: .75rem;
    }

    header {
        padding: 1rem;
    }
    }
</style>
</head>

<body>

<header>
    <h1>Student Profile</h1>
</header>

<main>
    <p>
    <a href="/">← Back to Talent Directory</a>
    </p>

    <section id="profile" class="profile">
    Loading profile...
    </section>

    <section id="aboutSection" class="profile" hidden></section>
    <section id="projectsSection">
    <h2>Project Evidence</h2>
    <div id="projects"></div>
    </section>
</main>

<script src="config.js"></script>
<script src="student.js"></script>

</body>
</html>
