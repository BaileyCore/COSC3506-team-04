name: Bug report
description: Report a reproducible problem
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: environment
    attributes:
      label: Environment
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
  - type: input
    id: requirement
    attributes:
      label: Requirement / scenario
  - type: dropdown
    id: severity
    attributes:
      label: Proposed severity
      options: [Critical, Major, Moderate, Minor]
    validations:
      required: true
  - type: dropdown
    id: reproducibility
    attributes:
      label: Reproducibility
      options: [Always, Intermittent, Observed once]
    validations:
      required: true
